[package]
name = "d-pkb-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.4.0", features = [
    "server",
    "transport-streamable-http-server",
] }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "fs",
    "process",
    "sync",
] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
regex = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = [
    "user-hooks",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
